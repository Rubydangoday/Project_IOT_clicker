# MQTT cho ARS (cài vào /etc/mosquitto/conf.d/ars.conf bởi install_ubuntu.sh)
#   1883  chỉ trong máy (ingest, bridge, ars sim) — không cần mật khẩu
#   9001  WebSocket, chỉ trong máy — Apache chuyển tiếp từ /mqtt cho gateway nRF52840 cắm vào máy giáo viên
#         (trang gateway.php dùng Web Serial của Chrome/Edge); cần tài khoản trong /etc/mosquitto/ars_passwd
# Phần cứng chỉ dùng nRF52840 (Remote Bluetooth → gateway USB) nên không mở cổng MQTT ra mạng LAN.
per_listener_settings true

listener 1883 127.0.0.1
allow_anonymous true

listener 9001 127.0.0.1
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/ars_passwd
acl_file /etc/mosquitto/ars_acl
