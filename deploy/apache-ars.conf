# Web ARS (cài bởi deploy/install_ubuntu.sh)
#   http://<máy>/gv  → giáo viên      http://<máy>/hs → học sinh      http://<máy>/ → trang chọn
#   http://<máy>/ars/ (đường dẫn đầy đủ)   ws://<máy>/mqtt → MQTT qua WebSocket (gateway nRF52840 cắm USB máy giáo viên, qua trình duyệt)
Alias /ars /opt/ars-server/web
Alias /favicon.ico /opt/ars-server/web/favicon.ico
AliasMatch "^/(gv|hs)(/[A-Za-z0-9]*)?/?$" /opt/ars-server/web/go.php
AliasMatch "^/$" /opt/ars-server/web/go.php
<Directory /opt/ars-server/web>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    php_value upload_max_filesize 60M
    php_value post_max_size 64M
    php_value max_execution_time 240
</Directory>
# Không cho tải các thư mục ngoài web/ (config.ini, db, mã Python)
<Directory /opt/ars-server>
    Require all denied
</Directory>
<Directory /opt/ars-server/web>
    Require all granted
</Directory>
<Directory /opt/ars-server/web/lib>
    Require all denied
</Directory>

# MQTT qua WebSocket → Mosquitto (chỉ nghe 127.0.0.1:9001, có mật khẩu). Cần: a2enmod proxy proxy_wstunnel
<IfModule mod_proxy_wstunnel.c>
    ProxyPass        "/mqtt" "ws://127.0.0.1:9001/mqtt"
    ProxyPassReverse "/mqtt" "ws://127.0.0.1:9001/mqtt"
</IfModule>

# Nhiều giáo viên + cả lớp học sinh cùng lúc: tăng số tiến trình Apache (mặc định 150)
<IfModule mpm_prefork_module>
    ServerLimit          300
    MaxRequestWorkers    300
</IfModule>
